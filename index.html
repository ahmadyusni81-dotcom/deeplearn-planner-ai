<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>DeepLearn Planner AI</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f4f7fb;--c:#fff;--t:#14213d;--m:#5b6b86;--p:#14325c;--pb:#14325c;--a:#d4a017;--l:#e3ecf7;--b:#d5deea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--c:#17233a;--t:#e8eefb;--m:#9fb0cc;--p:#8db8f5;--pb:#2f5da8;--l:#1f3150;--b:#2b3d5c}}
:root[data-theme="dark"]{--bg:#0e1626;--c:#17233a;--t:#e8eefb;--m:#9fb0cc;--p:#8db8f5;--pb:#2f5da8;--l:#1f3150;--b:#2b3d5c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--t)}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--pb);color:#fff;border-bottom:3px solid var(--a);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-size:18px;margin:0;flex:1}header img{height:34px;border-radius:6px}header small{opacity:.85}
.w{display:flex;min-height:calc(100vh - 56px)}nav{width:210px;padding:12px;background:var(--c);border-right:1px solid var(--b);flex-shrink:0}
nav button{display:block;width:100%;text-align:left;margin:3px 0;padding:10px 12px;border:0;border-radius:8px;background:none;color:var(--t);font:inherit;cursor:pointer}
nav button.on,nav button:hover{background:var(--l);color:var(--p);font-weight:600}main{flex:1;padding:18px;min-width:0;max-width:1100px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px;margin-bottom:14px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.st b{display:block;font-size:26px;color:var(--p)}h2{margin:0 0 10px;font-size:20px;color:var(--p)}h3{color:var(--p)}
label{display:block;font-size:13px;color:var(--m);margin:8px 0 3px}input,select,textarea{width:100%;padding:8px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
textarea{min-height:140px}button.b{background:var(--pb);color:#fff;border:0;padding:9px 14px;border-radius:8px;cursor:pointer;font:inherit;margin:3px 3px 3px 0}button.b.s{background:var(--l);color:var(--p)}button.b.d{background:#b3261e}button:disabled{opacity:.5}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.tabs button{white-space:nowrap;padding:8px 12px;border:1px solid var(--b);border-radius:20px;background:var(--c);color:var(--t);cursor:pointer;font:inherit}.tabs .on{background:var(--pb);color:#fff;border-color:var(--pb)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--b);padding:6px;text-align:left;vertical-align:top}th{background:var(--l);color:var(--p)}td input,td textarea,td select{min-height:0;height:auto}td textarea{min-height:60px}
.pv{border:1px dashed var(--b);padding:12px;border-radius:8px;margin-top:10px}.wr{background:#fff4d6;color:#5a4300;border-left:4px solid var(--a);padding:8px 12px;border-radius:6px;margin:8px 0}.ok{color:#1b7f3b}.nk{color:#b3261e}.mid{color:#9a6b00}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;background:var(--pb);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9}
@media(max-width:760px){.w{display:block}nav{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--b)}nav button{white-space:nowrap;width:auto}}
</style></head><body>
<header><div id="logo"></div><h1>DeepLearn Planner AI <small id="who"></small></h1><select id="wsel" onchange="swWs(this.value)" style="width:auto;max-width:170px" aria-label="Ruang kerja sekolah"></select><small id="syn"></small><button class="b s" onclick="theme()">◐ Tema</button></header>
<div class="w"><nav id="nav"></nav><main id="main"></main></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const J=['Dashboard','Profil Sekolah & Guru','Perencanaan','Dokumen Saya','Pengaturan'],IC=['🏠','🏫','🧭','📁','⚙️'];
const TABS=['1 Identitas & CP','2 TP','3 ATP','4 Alokasi Waktu','5 Program Semester','6 Program Tahunan','7 RPP Mendalam','8 Asesmen·LKPD·Rubrik','9 Periksa','10 Halaman Pengesahan','11 Cover Depan'];
const D={prof:{},plan:{jenjang:'SMP',fase:'D',kelas:'VIII',smt:'Ganjil',tahun:'2026/2027',mapel:'IPA',elemen:'',cp:'',cpAI:'',tp:[],mgu:16,jp:5,dur:40,bagi:'3,2',cad:0,sel:0,konteks:'',out:{}},docs:[],pg:0,tab:0,q:'',jf:'',set:{detail:'Lengkap',soal:5,gaya:'Baku formal'}};
let META;try{META=JSON.parse(localStorage.getItem('dlp_meta')||'null')}catch(e){}
if(!META){META={list:[{id:'w1',name:'Sekolah 1'}],cur:'w1'};try{const o=localStorage.getItem('dlp');if(o)localStorage.setItem('dlp_w1',o)}catch(e){}}
const ld=id=>{try{return JSON.parse(localStorage.getItem('dlp_'+id)||'null')}catch(e){return null}};
let S=ld(META.cur)||structuredClone(D),CL=null,TM=0,sync='Lokal';const P=()=>S.plan;
function save(){S.ts=Date.now();try{localStorage.setItem('dlp_'+META.cur,JSON.stringify(S));localStorage.setItem('dlp_meta',JSON.stringify(META))}catch(e){}clearTimeout(TM);TM=setTimeout(push,900)}
function stat(){const e=$('#syn');if(e)e.textContent=sync=='Cloud'?'☁ Tersimpan di akun':sync=='Lokal'?'💾 Hanya di perangkat ini':'⚠ Tidak bisa menyimpan ke akun (peran Viewer atau koneksi)'}
async function push(){if(!CL)return;try{const{logo,...pr}=S.prof||{};await CL.doc('ws_'+META.cur).set({j:JSON.stringify({...S,prof:pr,plan:(()=>{const pl={...S.plan};delete pl.rppM;return pl})()}),ts:S.ts});if(S.plan.rppM)await CL.doc('rpp_'+META.cur).set({j:JSON.stringify(S.plan.rppM)});if(logo)await CL.doc('logo_'+META.cur).set({l:logo});try{await DB.collection('directory').doc(UID).set({n:META.list.map(w=>w.name),ts:Date.now()})}catch(e){}await CL.doc('meta').set({j:JSON.stringify(META)});sync='Cloud'}catch(e){sync='Gagal'}stat()}
async function pull(){if(!CL)return;try{const w=await CL.doc('ws_'+META.cur).get();if(w.exists&&(w.data().ts||0)>(S.ts||0)){S=JSON.parse(w.data().j);const lg=await CL.doc('logo_'+META.cur).get();if(lg.exists)S.prof.logo=lg.data().l;const rr=await CL.doc('rpp_'+META.cur).get();if(rr.exists)S.plan.rppM=JSON.parse(rr.data().j);try{localStorage.setItem('dlp_'+META.cur,JSON.stringify(S))}catch(e){}}}catch(e){}}
function swWs(id,skip){if(!skip)save();META.cur=id;const l=ld(id);S=l||structuredClone(D);if(!l)S.ts=0;try{localStorage.setItem('dlp_meta',JSON.stringify(META))}catch(e){}render();pull().then(()=>{save();render()})}
async function addWs(){const n=await ask('Nama sekolah (ruang kerja baru)');if(!n)return;if(META.list.some(w=>w.name.toLowerCase()==n.toLowerCase()))return toast('Nama sekolah sudah ada',1);const id='w'+Date.now();save();META.list.push({id,name:n});META.cur=id;S=structuredClone(D);S.prof.sekolah=n;S.pg=1;save();render();toast('Ruang kerja "'+n+'" dibuat. Lengkapi profilnya.')}
async function delWs(id){if(META.list.length<2)return toast('Minimal satu ruang kerja',1);if(!await yes('Hapus ruang kerja ini beserta seluruh dokumennya?'))return;META.list=META.list.filter(w=>w.id!=id);try{localStorage.removeItem('dlp_'+id)}catch(e){}if(CL){CL.doc('ws_'+id).delete().catch(()=>{});CL.doc('logo_'+id).delete().catch(()=>{})}if(META.cur==id)swWs(META.list[0].id,1);else{save();render()}}
const fs=n=>((S.prof.sekolah||'')+' - '+n).replace(/[^\w\- ]/g,'').replace(/\s+/g,' ').trim();
function dlg(msg,def,isIn){return new Promise(r=>{const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px';o.innerHTML=`<div class="card" role="dialog" aria-modal="true" style="max-width:420px;width:100%;margin:0"><p><b>${esc(msg)}</b></p>${isIn?`<input id="dg" value="${esc(def||'')}">`:''}<div style="margin-top:10px"><button class="b" id="dy">OK</button><button class="b s" id="dn">Batal</button></div></div>`;document.body.append(o);const i=o.querySelector('#dg'),y=o.querySelector('#dy'),f=v=>{o.remove();r(v)};(i||y).focus();y.onclick=()=>f(isIn?i.value.trim():true);o.querySelector('#dn').onclick=()=>f(isIn?null:false);if(i)i.onkeydown=e=>{if(e.key=='Enter')y.click();if(e.key=='Escape')f(null)}})}
const ask=(m,d)=>dlg(m,d,1),yes=m=>dlg(m);
async function rst(){if(!await yes('Hapus seluruh data ruang kerja ini (profil, perencanaan, dokumen)?'))return;S=structuredClone(D);S.prof.sekolah=(META.list.find(w=>w.id==META.cur)||{}).name||'';save();render();toast('Data ruang kerja dikosongkan')}
let UID=null,DB=null,UU=null,ADM=false,READY=false,AD={list:null,sel:null,wss:null,msg:''};
const dt=t=>t?new Date(t).toLocaleDateString('id-ID'):'-';
async function admLoad(){AD.msg='Memuat…';render();try{const sn=await DB.collection('directory').get();const ids=sn.docs.map(d=>({id:d.id,...d.data()}));let nm={};try{nm=await UU.profiles(ids.map(x=>x.id))}catch(e){}ids.forEach(x=>x.name=(nm[x.id]&&nm[x.id].name)||'Pengguna '+x.id.slice(0,6));AD.list=ids;AD.msg=''}catch(e){AD.msg='Gagal memuat: '+(e.message||e.code)}render()}
async function admOpen(id){AD.sel=id;AD.wss=null;AD.msg='Memuat…';render();try{const sn=await DB.collection('data/users/'+id).get();AD.wss=sn.docs.filter(d=>d.id.startsWith('ws_')).map(d=>{try{return JSON.parse(d.data().j)}catch(e){return null}}).filter(Boolean);AD.msg=''}catch(e){AD.msg='Gagal: '+(e.message||e.code)}render()}
function admView(i,j){const d=AD.wss[i].docs[j],o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#0008;z-index:20;overflow:auto;padding:16px';o.innerHTML=`<div class="card" style="max-width:900px;margin:0 auto"><button class="b s">Tutup</button><h3>${esc(d.judul)}</h3><div class="sc">${md(d.isi)}</div></div>`;o.querySelector('button').onclick=()=>o.remove();document.body.append(o)}
function admExp(i,j,t){const b=S;S=AD.wss[i];const d=S.docs[j];try{(t=='w'?exp:pdf)(d.kunci,d.isi,d.judul)}finally{S=b}}
function admPage(){let h=`<div class="card"><h2>🛡️ Admin — Semua Sekolah</h2><div class="wr">Akses hanya-baca. Hanya admin yang dapat melihat ruang kerja pengguna lain; pengguna biasa hanya melihat ruang kerjanya sendiri.</div><button class="b s" onclick="AD.list=null;AD.sel=null;admLoad()">↻ Muat ulang</button> ${esc(AD.msg)}</div>`;
if(AD.list&&!AD.sel)h+=`<div class="card"><div class="sc"><table><tr><th>Pengguna</th><th>Sekolah</th><th>Terakhir aktif</th><th></th></tr>${AD.list.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc((u.n||[]).join(', '))}</td><td>${dt(u.ts)}</td><td><button class="b" onclick="admOpen('${u.id}')">Lihat</button></td></tr>`).join('')||'<tr><td colspan=4>Belum ada pengguna.</td></tr>'}</table></div></div>`;
if(AD.sel){const u=(AD.list||[]).find(x=>x.id==AD.sel);h+=`<div class="card"><button class="b s" onclick="AD.sel=null;render()">← Kembali</button> <b>${esc(u?.name)}</b></div>`+(AD.wss||[]).map((w,i)=>`<div class="card"><h3>${esc(w.prof?.sekolah||'(tanpa nama)')}</h3><p>Guru: ${esc(w.prof?.guru||'-')} · Mapel: ${esc(w.plan?.mapel||'-')} · ${w.docs?.length||0} dokumen</p>${(w.docs||[]).map((d,j)=>`<p>📄 ${esc(d.judul)} <small>(${d.jenis}, ${d.status}, ${d.tgl})</small> <button class="b s" onclick="admView(${i},${j})">Lihat</button><button class="b s" onclick="admExp(${i},${j},'w')">Word</button><button class="b s" onclick="admExp(${i},${j},'p')">PDF</button></p>`).join('')||'<p>Belum ada dokumen.</p>'}</div>`).join('')}
return h}
const wsCard=()=>`<div class="card"><h2>Ruang Kerja Sekolah</h2><p>Setiap sekolah memiliki ruang kerja terpisah: profil, CP, TP, ATP, RPP, dan dokumen tidak bercampur.</p>${META.list.map(w=>`<p>${w.id==META.cur?'✅':'⚪'} <b>${esc(w.name)}</b> <button class="b s" onclick="swWs('${w.id}')">Buka</button><button class="b d" onclick="delWs('${w.id}')">Hapus</button></p>`).join('')}<button class="b" onclick="addWs()">＋ Tambah sekolah</button><p><small>${sync=='Cloud'?'Tersimpan di akun Anda, tersinkron antarperangkat, dan hanya dapat dilihat oleh Anda serta administrator.':'Tersimpan hanya di peramban perangkat ini.'}</small></p></div>`;
(async()=>{try{UU=await claude.use('user');DB=await claude.use('db');if(!UU||!DB)throw 0;UID=await UU.id();if(!UID)throw 0;CL=DB.collection('data/users/'+UID);
try{const pv=localStorage.getItem('dlp_uid');if(pv&&pv!=UID){Object.keys(localStorage).filter(k=>k.startsWith('dlp')).forEach(k=>localStorage.removeItem(k));META={list:[{id:'w1',name:'Sekolah 1'}],cur:'w1'};S=structuredClone(D)}localStorage.setItem('dlp_uid',UID)}catch(e){}
ADM=!!((UU.canEdit&&UU.canEdit())||(UU.isOwner&&UU.isOwner()));if(ADM){J.push('Admin (Semua Sekolah)');IC.push('🛡️')}
const m=await CL.doc('meta').get();if(m.exists){JSON.parse(m.data().j).list.forEach(w=>{if(!META.list.find(x=>x.id==w.id))META.list.push(w)})}await pull();await push()}catch(e){sync='Lokal';CL=null}READY=true;render()})();
function toast(m,e){const t=$('#toast');t.textContent=m;t.style.background=e?'#b3261e':'';t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
function theme(){const r=document.documentElement;r.dataset.theme=r.dataset.theme=='dark'?'light':'dark'}
function set(path,v,r){const k=path.split('.');let o=S;k.slice(0,-1).forEach(x=>o=o[x]);o[k.at(-1)]=v;save();if(r)render()}
const inp=(p,l,t='text')=>{const v=p.split('.').reduce((o,x)=>o?.[x],S);return`<label>${l}<input type="${t}" value="${esc(v)}" onchange="set('${p}',this.value${t=='number'?'':''},${t=='number'})"></label>`};
const sel=(p,l,o)=>{const v=p.split('.').reduce((o,x)=>o?.[x],S);return`<label>${l}<select onchange="set('${p}',this.value)">${o.map(x=>`<option${x==v?' selected':''}>${x}</option>`).join('')}</select></label>`};
const area=(p,l,h)=>{const v=p.split('.').reduce((o,x)=>o?.[x],S);return`<label>${l}<textarea style="${h||''}" onchange="set('${p}',this.value)">${esc(v)}</textarea></label>`};
function calc(){const p=P(),jp=+p.jp||0,mg=+p.mgu||0,d=+p.dur||0,pr=String(p.bagi).split(',').map(Number).filter(x=>x>0),sp=pr.reduce((a,b)=>a+b,0),tot=mg*jp;return{jp,mg,d,pr,sp,mw:jp*d,tot,tm:tot*d,avail:tot-(+p.cad||0),used:p.tp.reduce((a,t)=>a+(+t.jp||0),0)}}
function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function md(t){t=svgExtract(clean(t));let o='',tb=0,ul=0;const cl=()=>{if(tb)o+='</table>';if(ul)o+='</ul>';tb=ul=0};for(let l of String(t||'').split('\n')){l=l.trim();if(!l){cl();continue}let mm;if(mm=l.match(/^\[\[SVG:(\d+)\]\]$/)){cl();o+=svgImg(window.SVGS[+mm[1]]);continue}
if(l[0]=='|'){if(/^\|[\s:|-]+\|?$/.test(l))continue;if(ul){o+='</ul>';ul=0}const cs=l.replace(/^\||\|$/g,'').split('|');o+=(tb?'':'<table>')+'<tr>'+cs.map(c=>(tb?'<td>':'<th>')+inl(c.trim())+(tb?'</td>':'</th>')).join('')+'</tr>';tb=1;continue}
if(tb){o+='</table>';tb=0}let m;if(m=l.match(/^(#+)\s*(.*)/)){if(ul){o+='</ul>';ul=0}o+=`<h${Math.min(m[1].length+1,5)}>${inl(m[2])}</h${Math.min(m[1].length+1,5)}>`}else if(/^[-*]\s/.test(l)){if(!ul){o+='<ul>';ul=1}o+='<li>'+inl(l.slice(2))+'</li>'}else{if(ul){o+='</ul>';ul=0}o+='<p>'+inl(l)+'</p>'}}cl();return o}
const tgl=()=>new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
function ctx(){const p=P(),f=S.prof;return`Sekolah: ${f.sekolah||'-'}; guru: ${f.guru||'-'}; mapel ${p.mapel}; ${p.jenjang} kelas ${p.kelas} fase ${p.fase}; semester ${p.smt}; TA ${p.tahun}; elemen CP (bisa lebih dari satu): ${p.elemen||'-'}. CP dari guru: ${p.cp||'(belum diisi)'}. Konteks kelas/sekolah: ${p.konteks||'-'}. MATERI SATU SEMESTER (TP harus mencakup seluruh materi ini, berurutan): ${p.materiSmt||'(belum diisi)'}. BATASAN MATERI (TP dan seluruh perangkat hanya boleh mencakup materi ini): ${p.batas||'(tidak dibatasi)'}. Materi di luar cakupan (jangan dibahas): ${p.luar||'-'}. Gaya: ${S.set.gaya}.`}
const SYS='Anda ahli Kurikulum Merdeka dan Pembelajaran Mendalam (berkesadaran, bermakna, menggembirakan; pengalaman memahami, mengaplikasi, merefleksi). Gunakan bahasa Indonesia baku. Jangan mengarang CP resmi, peraturan, nomor dokumen, atau tautan. Beri tanda "[Perlu verifikasi guru]" pada hal yang belum pasti. Keluaran dalam markdown (## judul, tabel dengan |, daftar -). Jangan menulis blok tanda tangan atau tulisan "Mengetahui" (ditambahkan otomatis oleh aplikasi), dan jangan memakai entitas atau tag HTML seperti &nbsp; atau <br>.\n\n';
function selTP(){const s=P().tp.filter(t=>t.pilih);return(s.length?s:P().tp).map(t=>`- ${t.tp} (materi: ${t.materi}; indikator: ${t.indikator})`).join('\n')}
const PR={
rpp:()=>{const c=calc(),M=mt()[P().sel]||mt()[0]||{n:1,jp:c.jp,t:null},jp=M.jp;return`${ctx()}\nBuat RPP Pembelajaran Mendalam untuk pertemuan ke-${M.n}, ${jp} JP x ${c.d} menit = ${jp*c.d} menit. TP pertemuan ini:\n${M.t?'- '+M.t.tp+' (materi: '+M.t.materi+'; indikator: '+M.t.indikator+')':selTP()}\nSusun bagian: 1 Identitas; 2 Identifikasi peserta didik (beragam, tanpa label tetap); 3 Perencanaan (CP, TP, indikator, materi esensial, pemahaman bermakna, pertanyaan pemantik, dimensi profil lulusan yang benar-benar relevan, model/metode, media, diferensiasi); 4 Desain Pembelajaran Mendalam; 5 Langkah pembelajaran (awal, inti, penutup) dalam TABEL: tahap | aktivitas guru | aktivitas peserta didik | prinsip (berkesadaran/bermakna/menggembirakan) | pengalaman (memahami/mengaplikasi/merefleksi) | menit | bukti belajar. Total menit WAJIB tepat ${jp*c.d}. Lalu 6 asesmen ringkas; 7 diferensiasi; 8 remedial & pengayaan; 9 refleksi siswa dan guru. Detail: ${S.set.detail}.`},
asesmen:()=>`${ctx()}\nTP:\n${selTP()}\nBuat asesmen: diagnostik (pertanyaan + pedoman analisis + pengelompokan fleksibel), formatif (instrumen + indikator + umpan balik), sumatif (${S.set.soal} soal/tugas + kunci/contoh jawaban + pedoman penskoran). Pilih bentuk yang tepat, jangan semua wajib.`,
lkpd:()=>`${ctx()}\nTP:\n${selTP()}\nBuat LKPD aktif: identitas, judul, tujuan, petunjuk, masalah kontekstual, alat bahan (jika perlu), langkah, tabel pengamatan, pertanyaan analisis, tugas aplikasi, simpulan, refleksi, kriteria keberhasilan.`,
rubrik:()=>`${ctx()}\nTP:\n${selTP()}\nBuat rubrik analitik sesuai tugas/produk yang relevan (bukan semua jenis): aspek, indikator, 4 tingkat dengan deskripsi spesifik teramati, skor, bobot, rumus nilai akhir, tindak lanjut. Tampilkan dalam tabel.`,
cpAI:()=>`${ctx()}\nAnalisis CP yang diberikan guru: kompetensi, lingkup materi, kata kerja capaian, dan ringkasan tanpa mengubah makna. Jangan menambah CP baru. Jika CP kosong, katakan CP harus diisi dari dokumen resmi.`,

const NAME={cpAI:'CP (Analisis AI)',rpp:'RPP',asesmen:'Asesmen',lkpd:'LKPD',rubrik:'Rubrik',cek:'Pemeriksaan',tp:'TP',atp:'ATP',waktu:'Alokasi Waktu',promes:'Program Semester',prota:'Program Tahunan',pgs:'Halaman Pengesahan',cv:'Cover Depan'};
const busy={};
async function gen(k){busy[k]=1;render();try{const s=await claude.use('sample');let t;if(!s)t='## MODE DEMO — AI belum terhubung\nBuka halaman ini lewat claude.ai dan izinkan akses Claude agar isi dihasilkan. Anda tetap dapat mengetik isi secara manual pada kolom ini.';else t=(await s(SYS+PR[k](),{onText:r=>{const a=$('#ta-'+k);if(a)a.value=r.text},cache:false})).text;P().out[k]=t;save();toast('Hasil siap diedit')}catch(e){toast('Gagal: '+(e.message||e.code||'kesalahan')+'. Silakan coba lagi.',1)}busy[k]=0;render()}
async function genTP(){busy.tp=1;render();try{const s=await claude.use('sample');if(!s)throw{message:'AI belum terhubung (mode demo). Tambah TP manual.'};const c=calc();const r=await s.json(SYS+ctx()+`\nTurunkan CP menjadi TP terukur yang mencakup SELURUH materi satu semester pada daftar MATERI SATU SEMESTER (minimal 1 TP per materi, berurutan sesuai daftar, jumlah TP menyesuaikan jumlah materi; bila daftar kosong buat 4-8 TP; sebarkan JP proporsional ke seluruh materi sehingga total mendekati JP tersedia) (kata kerja operasional) yang HANYA mencakup materi dalam batasan materi (isi field materi memakai istilah dari batasan; jangan membuat TP untuk materi di luar batasan, abaikan bagian CP yang di luar batasan) dan total JP-nya ≤ ${c.avail} JP (1 JP=${c.d} menit; JP per minggu = ${c.jp}; nilai jp setiap TP WAJIB kelipatan ${c.jp}, yaitu ${c.jp}, ${c.jp*2}, ${c.jp*3}, dan seterusnya, tanpa pecahan). Setiap elemen memiliki CP sendiri (ditulis sebagai [Nama Elemen] isi CP). Turunkan TP dari CP elemen yang bersangkutan dan isi field elemen dengan nama elemen tersebut; setiap elemen harus terwakili TP dan jangan mencampur CP antarelemen. Jawab HANYA array JSON: [{"tp":"","elemen":"","materi":"","indikator":"","jp":number}]`);P().tp=r.map(x=>({tp:x.tp,elemen:x.elemen||'',materi:x.materi,indikator:x.indikator,jp:+x.jp||0,smt:P().smt,pilih:0}));fixJP();save();toast('TP dihasilkan')}catch(e){toast('Gagal: '+(e.message||e.code),1)}busy.tp=0;render()}
async function ordAI(){busy.atp=1;render();try{const s=await claude.use('sample');if(!s)throw{message:'AI belum terhubung (mode demo)'};const r=await s.json(SYS+'Urutkan TP berikut secara logis (prasyarat, kompleksitas). Jawab HANYA array JSON berisi indeks 0-based semua TP dalam urutan baru.\n'+P().tp.map((t,i)=>i+': '+t.tp).join('\n'));if(r.length==P().tp.length){P().tp=r.map(i=>P().tp[i]);save()}toast('Urutan diperbarui; periksa kembali')}catch(e){toast('Gagal: '+(e.message||e.code),1)}busy.atp=0;render()}
const tpMd=()=>'| No | Tujuan Pembelajaran | Elemen | Materi Esensial | Indikator | Estimasi JP |\n|---|---|---|---|---|---|\n'+P().tp.map((t,i)=>`| ${i+1} | ${t.tp} | ${t.elemen||'-'} | ${t.materi} | ${t.indikator} | ${t.jp} |`).join('\n');
const atpMd=()=>'| No | Capaian Pembelajaran | Tujuan Pembelajaran | Materi Esensial | Urutan | Alokasi Waktu | Semester |\n|---|---|---|---|---|---|---|\n'+P().tp.map((t,i)=>`| ${i+1} | ${((ELS().find(e=>e.n==t.elemen)||{cp:P().cp}).cp||'').slice(0,150)} | ${t.tp} | ${t.materi} | ${i+1} | ${t.jp} JP (${t.jp*calc().d} menit) | ${P().smt} |`).join('\n');
function dist(){const c=calc();let cum=0;return P().tp.map(t=>{const a=Math.ceil((cum+1)/(c.jp||1)),b=Math.ceil((cum+(+t.jp||0))/(c.jp||1));cum+=+t.jp||0;return{a,b,t}})}
const wMd=()=>{const c=calc();return`Total menit/minggu: ${c.mw}; JP/semester: ${c.tot}; menit/semester: ${c.tm}\n\n| Minggu | TP | Materi Esensial | JP | Menit |\n|---|---|---|---|---|\n`+dist().map(x=>`| ${x.a==x.b?x.a:x.a+'–'+x.b} | ${x.t.tp} | ${x.t.materi} | ${x.t.jp} | ${x.t.jp*c.d} |`).join('\n')};
const MD={tp:tpMd,atp:atpMd,waktu:wMd,promes:()=>pMd(),prota:()=>prMd(),pgs:()=>pgMd(),cv:()=>cvMd()};
function saveDoc(k,text){const t=text??(MD[k]?MD[k]():P().out[k]);if(!t)return toast('Belum ada isi',1);S.docs.unshift({id:Date.now(),jenis:NAME[k],kunci:k,judul:`${NAME[k]} ${P().mapel} Kelas ${P().kelas} ${P().smt}`,isi:t,status:'Draf',tgl:tgl(),ts:Date.now(),arsip:0});save();toast('Tersimpan di Dokumen Saya')}
function html(title,t){const f=S.prof;return`<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>@page{size:A4;margin:2cm}body{font:12pt Arial}table{border-collapse:collapse;width:100%}td,th{border:1px solid #000;padding:4px;font-size:10.5pt}th{background:#dce6f4}</style></head><body><h2 style="text-align:center">${esc(title)}</h2><p style="text-align:center">${esc(f.sekolah||'')} — Tahun Pelajaran ${esc(P().tahun)}</p>${md(t)}<br><table style="border:0"><tr><td style="border:0">Mengetahui,<br>Kepala Sekolah<br><br><br><u>${esc(f.kepsek||'..........')}</u></td><td style="border:0">${tgl()}<br>Guru Mata Pelajaran<br><br><br><u>${esc(f.guru||'..........')}</u><br>NIP. ${esc(f.nip||'-')}</td></tr></table></body></html>`}
async function dl(name,data,type){const d=await claude.use('downloads');if(!d)return toast('Unduhan tidak tersedia di tampilan ini',1);try{await d.save({filename:name,data:new Blob([data],{type})})}catch(e){toast('Unduhan dibatalkan/gagal',1)}}
const exWord=(k,t)=>dl((t.j||NAME[k])+'.doc',html(NAME[k],t.x),'application/msword');
function exp(k,x){exWord(k,{x:x??(MD[k]?MD[k]():P().out[k])})}
function pdf(k){const x=MD[k]?MD[k]():P().out[k];const f=document.createElement('iframe');f.style.cssText='position:fixed;width:0;height:0;border:0';f.srcdoc=html(NAME[k],x);f.onload=()=>{try{f.contentWindow.print()}catch(e){toast('Cetak diblokir; gunakan Word lalu simpan sebagai PDF',1)}};document.body.append(f)}
function csv(k){const c=calc();const r=k=='waktu'?[['Minggu','TP','Materi','JP','Menit'],...dist().map(x=>[x.a+'-'+x.b,x.t.tp,x.t.materi,x.t.jp,x.t.jp*c.d])]:[['No','TP','Materi','Indikator','JP','Semester'],...P().tp.map((t,i)=>[i+1,t.tp,t.materi,t.indikator,t.jp,t.smt])];dl(k+'.csv','\ufeff'+r.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
const bar=k=>`<button class="b s" onclick="saveDoc('${k}')">💾 Simpan</button><button class="b s" onclick="exp('${k}')">📄 Word</button><button class="b s" onclick="pdf('${k}')">🖨 PDF/Cetak</button>`;
function out(k,l){const v=P().out[k]||'';return`<div class="card"><button class="b" ${busy[k]?'disabled':''} onclick="gen('${k}')">${busy[k]?'⏳ Menghasilkan…':'✨ Generate '+l}</button>${bar(k)}<label>Hasil (dapat diedit)<textarea id="ta-${k}" style="min-height:220px" oninput="P().out['${k}']=this.value;save();$('#pv-${k}').innerHTML=md(this.value)">${esc(v)}</textarea></label><div class="pv" id="pv-${k}">${md(v)}</div></div>`}
function tpTable(atp){const c=calc();return`${batasWarn()}${smtWarn()}${kelWarn()}<div class="sc"><table><tr><th>No</th>${atp?'<th>Pilih</th>':''}<th>Tujuan Pembelajaran</th><th>Elemen</th><th>Materi Esensial</th><th>Indikator</th><th>JP</th><th>Smt</th><th>Aksi</th></tr>`+P().tp.map((t,i)=>`<tr><td>${i+1}</td>${atp?`<td><input type="checkbox" ${t.pilih?'checked':''} onchange="P().tp[${i}].pilih=this.checked;save()"></td>`:''}${['tp','elemen','materi','indikator'].map(f=>`<td><textarea onchange="P().tp[${i}].${f}=this.value;save()">${esc(t[f])}</textarea></td>`).join('')}<td><input type="number" min="0" step="${calc().jp||1}" style="width:60px" value="${t.jp}" onchange="P().tp[${i}].jp=+this.value;render()"></td><td><select onchange="P().tp[${i}].smt=this.value;save()">${['Ganjil','Genap'].map(s=>`<option${s==(t.smt||P().smt)?' selected':''}>${s}</option>`).join('')}</select></td><td><button class="b s" onclick="mv(${i},-1)">↑</button><button class="b s" onclick="mv(${i},1)">↓</button><button class="b s" onclick="sp(${i})" title="Pecah">✂</button><button class="b d" onclick="P().tp.splice(${i},1);save();render()">✕</button></td></tr>`).join('')+`</table></div><p>Total: <b>${c.used} JP</b> (${c.used*c.d} menit) dari tersedia <b>${c.avail} JP</b>.</p>${c.used>c.avail?`<div class="wr">Total TP melebihi waktu tersedia ${c.used-c.avail} JP. Kurangi alokasi atau tambah waktu.</div>`:c.used<c.avail?`<div class="wr">Waktu tersisa ${c.avail-c.used} JP; periksa apakah untuk asesmen/pengayaan.</div>`:''}${P().tp.some(t=>!+t.jp)?'<div class="wr">Ada TP tanpa alokasi waktu.</div>':''}`}
function mv(i,d){const a=P().tp,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}
function sp(i){const k=calc().jp||1,t=P().tp[i],h=Math.floor(t.jp/k/2)*k;if(h<k)return toast('JP minimal '+(2*k)+' untuk dipecah (kelipatan '+k+' JP)',1);P().tp.splice(i+1,0,{...t,tp:t.tp+' (lanjutan)',jp:t.jp-h});t.jp=h;save();render()}
const addTP=()=>{P().tp.push({tp:'',materi:'',indikator:'',jp:calc().jp||2,smt:P().smt,pilih:0});save();render()};
function tab(){const p=P(),c=calc(),t=S.tab;
if(t==0)return`<div class="card"><h2>Identitas & Capaian Pembelajaran</h2><div class="g">${sel('plan.jenjang','Jenjang',['SD','SMP','SMA','SMK'])}${sel('plan.fase','Fase',['A','B','C','D','E','F'])}${inp('plan.kelas','Kelas')}<label>Semester aktif<select onchange="semSwitch(this.value)">${SMT.map(s=>`<option${s==p.smt?' selected':''}>${s}</option>`).join('')}</select></label>${inp('plan.tahun','Tahun pelajaran')}${inp('plan.mapel','Mata pelajaran')}<div style="grid-column:1/-1">${elField()}</div></div>${matArea('Ganjil')}${matArea('Genap')}${p.materiSmt?'':'<div class="wr">Materi satu semester belum diisi: TP hanya akan diturunkan dari CP, belum tentu mencakup seluruh materi semester.</div>'}${area('plan.batas','Batasan materi (wajib diisi agar TP sesuai) — tulis bab/subbab/topik yang boleh dicakup, satu per baris','min-height:110px')}${area('plan.luar','Materi di luar cakupan (opsional) — topik yang tidak boleh dibahas','min-height:70px')}${p.batas?'':'<div class="wr">Batasan materi kosong: TP dapat meluas ke seluruh CP. Isi agar TP yang dihasilkan hanya sesuai materi yang Anda ajarkan.</div>'}${area('plan.konteks','Karakteristik peserta didik & kondisi sekolah (opsional)')}${p.cp?'':'<div class="wr">CP belum diisi. AI tidak membuat CP resmi pemerintah; verifikasi dengan dokumen kurikulum berlaku.</div>'}<button class="b" ${busy.cpAI?'disabled':''} onclick="gen('cpAI')">${busy.cpAI?'⏳ Menganalisis…':'🔎 Bantu analisis CP dengan AI'}</button></div>${out2('cpAI','Hasil analisis AI (terpisah dari CP asli)')}`;
if(t==1)return`<div class="card"><h2>Tujuan Pembelajaran</h2><button class="b" ${busy.tp?'disabled':''} onclick="genTP()">${busy.tp?'⏳ Menghasilkan…':'✨ Generate TP dari CP'}</button><button class="b s" onclick="addTP()">＋ Tambah TP</button><button class="b s" onclick="saveDoc('tp')">💾 Simpan</button><button class="b s" onclick="exp('tp')">📄 Word</button>${tpTable()}</div>`;
if(t==2)return`<div class="card"><h2>Alur Tujuan Pembelajaran (ATP)</h2><button class="b" ${busy.atp?'disabled':''} onclick="ordAI()">${busy.atp?'⏳…':'✨ Urutkan logis dengan AI'}</button><button class="b s" onclick="addTP()">＋ Tambah</button><button class="b s" onclick="saveDoc('atp')">💾 Simpan</button><button class="b s" onclick="exp('atp')">📄 Word</button><button class="b s" onclick="pdf('atp')">🖨 PDF</button><button class="b s" onclick="csv('atp')">📊 Excel (CSV)</button><p>Centang TP untuk dipakai di RPP.</p>${tpTable(1)}</div>`;
if(t==3)return`<div class="card"><h2>Alokasi Waktu</h2><div class="g">${inp('plan.mgu','Minggu efektif/semester','number')}${inp('plan.jp','JP per minggu','number')}${inp('plan.dur','Menit per JP','number')}${inp('plan.bagi','Pembagian JP per pertemuan (mis. 3,2)')}${inp('plan.cad','JP cadangan (asesmen/remedial)','number')}</div><div class="g" style="margin-top:12px"><div class="st card">Menit/minggu<b>${c.mw}</b></div><div class="st card">JP/semester<b>${c.tot}</b></div><div class="st card">Menit/semester<b>${c.tm}</b></div><div class="st card">Pertemuan/minggu<b>${c.pr.length}</b></div></div><p>Pertemuan: ${c.pr.map((x,i)=>`ke-${i+1}: ${x} JP = ${x*c.d} menit`).join(' · ')}</p>${c.sp!=c.jp?`<div class="wr">Jumlah JP pertemuan (${c.sp}) tidak sama dengan JP per minggu (${c.jp}).</div>`:''}${c.used!=c.avail?`<div class="wr">Total TP ${c.used} JP vs tersedia ${c.avail} JP — selisih ${c.avail-c.used}. Sesuaikan manual; aplikasi tidak mengubahnya otomatis.</div>`:''}${kelWarn()}${mtgTable()}<h3>Distribusi per minggu</h3><div class="sc"><table><tr><th>Minggu</th><th>Pertemuan</th><th>TP</th><th>Materi Esensial</th><th>JP</th><th>Menit</th><th>Kegiatan Utama</th></tr>${dist().map(x=>`<tr><td>${x.a==x.b?x.a:x.a+'–'+x.b}</td><td>${c.pr.length}/minggu</td><td>${esc(x.t.tp)}</td><td>${esc(x.t.materi)}</td><td>${x.t.jp}</td><td>${x.t.jp*c.d}</td><td>Memahami → Mengaplikasi → Merefleksi</td></tr>`).join('')}</table></div><button class="b s" onclick="saveDoc('waktu')">💾 Simpan</button><button class="b s" onclick="exp('waktu')">📄 Word</button><button class="b s" onclick="csv('waktu')">📊 Excel (CSV)</button></div>`;
if(t==10)return cvTab();if(t==9)return pgTab();if(t==4)return promes();if(t==5)return prota();if(t==6)return rppTab(p,c);if(t==-1)return`<div class="card"><h2>RPP Pembelajaran Mendalam</h2><label>Pertemuan<select onchange="set('plan.sel',+this.value,true)">${c.pr.map((x,i)=>`<option value="${i}"${i==p.sel?' selected':''}>Pertemuan ${i+1} — ${x} JP (${x*c.d} menit)</option>`).join('')}</select></label><p>TP dipilih (centang di tab ATP):</p><ul>${p.tp.filter(x=>x.pilih).map(x=>`<li>${esc(x.tp)}</li>`).join('')||'<li>Belum ada; semua TP dipakai.</li>'}</ul></div>${out('rpp','RPP')}`;
if(t==7)return lampTab();if(t==-2)return out('asesmen','Asesmen')+out('lkpd','LKPD')+out('rubrik','Rubrik');
return`<div class="card"><h2>Pemeriksaan Konsistensi</h2>${chk().map(([s,m])=>`<p class="${s=='Sesuai'?'ok':s=='Belum lengkap'?'nk':'mid'}"><b>${s}</b> — ${m}</p>`).join('')}<button class="b s" onclick="render()">Periksa Kembali</button></div>${out('cek','Pemeriksaan AI')}`}
function out2(k,l){return`<div class="card"><label>${l}<textarea id="ta-${k}" oninput="P().out['${k}']=this.value;save()">${esc(P().out[k]||'')}</textarea></label></div>`}
function smtWarn(){const L=(P().materiSmt||'').split('\n').map(s=>s.trim()).filter(Boolean);if(!L.length||!P().tp.length)return'';const T=P().tp.map(t=>((t.materi||'')+' '+(t.tp||'')).toLowerCase()).join(' ');const x=L.filter(l=>{const w=l.toLowerCase().split(/[^a-z0-9]+/).filter(z=>z.length>3);return w.length&&!w.some(z=>T.includes(z))});return x.length?`<div class="wr">Materi semester yang belum tercakup TP: ${esc(x.join('; '))}.</div>`:''}
function batasWarn(){const b=(P().batas||'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>3);if(!b.length||!P().tp.length)return'';const x=P().tp.map((t,i)=>({i,s:((t.materi||'')+' '+(t.tp||'')).toLowerCase()})).filter(o=>!b.some(w=>o.s.includes(w))).map(o=>o.i+1);return x.length?`<div class="wr">TP nomor ${x.join(', ')} tampaknya di luar batasan materi. Periksa, edit, atau hapus.</div>`:''}
const EL=()=>String(P().elemen||'').split(/\s*;\s*|\n/).map(s=>s.trim()).filter(Boolean);
function elSet(a){P().elemen=a.join('; ');save();render();const i=$('#elin');if(i)i.focus()}
function elAdd(){const i=$('#elin'),v=(i&&i.value||'').trim();if(!v)return;const a=EL();if(!a.some(x=>x.toLowerCase()==v.toLowerCase()))a.push(v);elSet(a)}
function elDel(i){const a=EL();a.splice(i,1);elSet(a)}
function elField(){return`<label>Elemen (dapat diisi lebih dari satu)</label><div style="display:flex;gap:6px"><input id="elin" placeholder="Ketik satu elemen lalu tekan Enter atau Tambah" onkeydown="if(event.key=='Enter'){event.preventDefault();elAdd()}"><button class="b" style="white-space:nowrap" onclick="elAdd()">＋ Tambah</button></div><div>${EL().map((e,i)=>`<span style="display:inline-block;background:var(--l);color:var(--p);border-radius:16px;padding:3px 6px 3px 12px;margin:6px 6px 0 0">${esc(e)} <button class="b s" style="padding:0 7px;margin:0" aria-label="Hapus elemen" onclick="elDel(${i})">✕</button></span>`).join('')||'<small>Belum ada elemen.</small>'}</div>`}
function ELS(){const p=P();if(!p.els){const n=EL();p.els=n.length?n.map((x,i)=>({n:x,cp:i?'':(p.cp||'')})):[{n:'',cp:p.cp||''}]}return p.els}
function elSync(){const p=P(),a=ELS().filter(e=>e.n||e.cp);p.elemen=a.map(e=>e.n).filter(Boolean).join('; ');p.cp=a.map(e=>((e.n?'['+e.n+'] ':'')+e.cp).trim()).filter(Boolean).join('\n\n');save()}
function elUp(i,f,v){ELS()[i][f]=v;elSync()}
function elAdd(){ELS().push({n:'',cp:''});save();render()}
function elDel(i){ELS().splice(i,1);if(!ELS().length)ELS().push({n:'',cp:''});elSync();render()}
function elField(){return ELS().map((e,i)=>`<div class="card" style="margin:8px 0"><label>Elemen ${i+1}<input value="${esc(e.n)}" oninput="elUp(${i},'n',this.value)"></label><label>Capaian Pembelajaran elemen ini (tempel dari dokumen kurikulum resmi)<textarea oninput="elUp(${i},'cp',this.value)">${esc(e.cp)}</textarea></label><button class="b d" onclick="elDel(${i})">Hapus elemen</button></div>`).join('')+'<button class="b s" onclick="elAdd()">＋ Tambah elemen</button>'}
const BLN={Ganjil:['Juli','Agustus','September','Oktober','November','Desember'],Genap:['Januari','Februari','Maret','April','Mei','Juni']};

const ctxU=()=>{const M=mt()[P().sel]||mt()[0];if(!M)return ctx();const R=getR(M);return`${ctx()}\nRPP yang dilengkapi: ${lbU(M)} (TP ${M.i+1}, ${M.jp} JP = ${M.jp*calc().d} menit). TP: ${M.t.tp} (materi: ${M.t.materi}; indikator: ${M.t.indikator}).${R?'\nRingkasan RPP (selaraskan dengan isi ini):\n'+R.slice(0,3500):''}`};
PR.lkpd=()=>`${ctxU()}\nBuat LKPD LENGKAP dan siap pakai untuk RPP ini: identitas peserta didik/kelompok, judul, tujuan, petunjuk, masalah kontekstual, alat dan bahan, langkah kegiatan terperinci, tabel pengamatan/lembar kerja yang sudah berisi kolom dan baris, pertanyaan analisis (minimal 5), tugas aplikasi, simpulan, refleksi, kriteria keberhasilan, dan kunci/contoh jawaban untuk guru. ${IMGI}`;
PR.asesmen=()=>`${ctxU()}\nBuat asesmen LENGKAP untuk RPP ini: (1) diagnostik: 3-5 pertanyaan + pedoman analisis + pengelompokan fleksibel; (2) formatif: instrumen observasi/kuis dengan indikator dan umpan balik; (3) sumatif: ${S.set.soal} soal/tugas sesuai TP, diawali kisi-kisi singkat (indikator, level kognitif, nomor soal), soal lengkap beserta pilihan jawaban bila pilihan ganda, kunci jawaban/contoh jawaban, dan pedoman penskoran. ${IMGI}`;
PR.rubrik=()=>`${ctxU()}\nBuat rubrik analitik untuk tugas/produk/kinerja pada RPP ini (jenis yang relevan saja): aspek, indikator, 4 tingkat dengan deskripsi spesifik teramati, skor, bobot, rumus nilai akhir, tindak lanjut. Tampilkan dalam tabel.`;
function safeSvg(s){s=String(s).trim().replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<foreignObject[\s\S]*?<\/foreignObject>/gi,'').replace(/\son\w+\s*=\s*("[^"]*"|'[^']*')/gi,'').replace(/javascript:/gi,'').replace(/(xlink:href|href)\s*=\s*("https?:[^"]*"|'https?:[^']*')/gi,'');if(!/<svg[^>]*xmlns=/i.test(s))s=s.replace(/<svg/i,'<svg xmlns="http://www.w3.org/2000/svg"');const vb=s.match(/<svg[^>]*viewBox="([\d.\s-]+)"/i);if(vb&&!/<svg[^>]*\swidth=/i.test(s)){const a=vb[1].trim().split(/\s+/);s=s.replace(/<svg/i,'<svg width="'+a[2]+'" height="'+a[3]+'"')}return s}
const svgImg=s=>`<div style="text-align:center"><img alt="Ilustrasi" style="max-width:100%;max-height:320px;background:#fff;border:1px solid var(--b);border-radius:6px" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(safeSvg(s))}"></div>`;
function svgExtract(t){window.SVGS=window.SVGS||[];return String(t).replace(/```svg[^\n]*\n([\s\S]*?)```/gi,(m,s)=>{window.SVGS.push(s);return'\n[[SVG:'+(window.SVGS.length-1)+']]\n'})}
function svgPng(svg){return new Promise(r=>{try{const i=new Image();i.onload=()=>{try{const w=i.naturalWidth||800,h=i.naturalHeight||500,k=900/Math.max(w,h,1),W=Math.round(w*k),H=Math.round(h*k),c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(i,0,0,W,H);const d=c.toDataURL('image/png');r({u:d,w:W,h:H,b:Uint8Array.from(atob(d.split(',')[1]),z=>z.charCodeAt(0))})}catch(e){r(null)}};i.onerror=()=>r(null);i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(safeSvg(svg))}catch(e){r(null)}})}
async function prepImg(t){window.IMGS=[];const re=/```svg[^\n]*\n([\s\S]*?)```/gi,L=[];let m;while(m=re.exec(t))L.push(m[1]);if(!L.length)return t;const R=await Promise.all(L.map(svgPng));let i=0;return t.replace(re,()=>{const r=R[i++];if(!r)return'';window.IMGS.push(r);return'\n[[IMG:'+(window.IMGS.length-1)+']]\n'})}
function imgP(id){const I=(window.IMGS||[])[id];if(!I)return'';const w=4680000,h=Math.round(w*I.h/I.w),sc=h>3600000?3600000/h:1,cx=Math.round(w*sc),cy=Math.round(h*sc),n=id+1;return`<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:before="80" w:after="80"/></w:pPr><w:r><w:drawing><wp:inline xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${n+10}" name="Gambar ${n}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${n}" name="g${n}.png"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:embed="rIdImg${n}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`}
function imgFiles(){const I=window.IMGS||[];if(!I.length)return[];return[...I.map((x,i)=>['word/media/g'+(i+1)+'.png',x.b]),['word/_rels/document.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+I.map((x,i)=>`<Relationship Id="rIdImg${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/g${i+1}.png"/>`).join('')+'</Relationships>']]}
async function exp(k,x,j){const t=x??(MD[k]?MD[k]():P().out[k]);if(!t)return toast('Belum ada isi untuk diunduh',1);const SS=S,nm=fs(fname(k,j));try{let b;if(k=='cv')b=await cvDocx();else if(k=='pgs')b=pgDocx();else{const tt=await prepImg(t),bk=S;S=SS;try{b=docx(j||NAME[k],tt)}finally{S=bk;window.IMGS=null}}await dl(nm+'.docx',b)}catch(e){toast('Gagal membuat Word: '+e.message,1)}}
async function pdf(k,x,j){const t=x??(MD[k]?MD[k]():P().out[k]);if(!t)return toast('Belum ada isi untuk diunduh',1);const SS=S,nm=fs(fname(k,j));try{let b;if(k=='cv')b=await cvPdf();else if(k=='pgs')b=pgPdf();else{const tt=await prepImg(t),bk=S;S=SS;try{b=pdfBlob(j||NAME[k],tt)}finally{S=bk;window.IMGS=null}}await dl(nm+'.pdf',b)}catch(e){toast('Gagal membuat PDF: '+e.message,1)}}
function pkgText(m){const L=lampOf(m);return[`# ${lbU(m)}: TP ${m.i+1} (pertemuan ${lbK(m)}, ${m.jp} JP)\n\n${getR(m)||''}`,L.lkpd?`# Lampiran 1. LKPD ${lbU(m)}\n\n${L.lkpd}`:'',L.asesmen?`# Lampiran 2. Asesmen ${lbU(m)}\n\n${L.asesmen}`:'',L.rubrik?`# Lampiran 3. Rubrik ${lbU(m)}\n\n${L.rubrik}`:''].filter(Boolean).join('\n\n')}
function pkgExp(t){const m=mt()[P().sel];if(!m)return toast('Belum ada RPP',1);const x=pkgText(m),j='Paket '+lbU(m)+' TP '+(m.i+1)+' '+P().mapel;t=='w'?exp('rpp',x,j):pdf('rpp',x,j)}
function allExp(t){const x=mt().filter(m=>getR(m)||lampOf(m).lkpd||lampOf(m).asesmen).map(pkgText).join('\n\n');if(!x)return toast('Belum ada RPP',1);const j='RPP Gabungan '+P().mapel+' Kelas '+P().kelas;t=='w'?exp('rpp',x,j):t=='p'?pdf('rpp',x,j):saveDoc('rpp',x)}
let LB={run:0,done:0,tot:0,err:'',stop:0};
async function lbatch(){const s=await claude.use('sample');if(!s)return toast('AI belum terhubung (mode demo)',1);const M=mt(),keep=P().sel,Lm=P().lampM=P().lampM||{},todo=[];M.forEach((m,k)=>{const L=Lm[rk(m)]||{};['lkpd','asesmen'].forEach(f=>{if(!L[f])todo.push([k,f])})});LB={run:1,done:0,tot:todo.length,err:'',stop:0};if(!todo.length){LB.run=0;return toast('LKPD dan asesmen sudah lengkap untuk semua RPP')}render();
for(const[k,f]of todo){if(LB.stop)break;try{P().sel=k;const r=await s(SYS+PR[f](),{cache:false}),key=rk(M[k]);(Lm[key]=Lm[key]||{})[f]=clean(r.text);save();LB.done++;render();await new Promise(z=>setTimeout(z,2500))}catch(e){LB.err=errMsg(e);break}}
LB.run=0;LB.stop=0;P().sel=keep;save();render()}
function lampTab(){const p=P(),c=calc(),M=mt();if(p.sel>=M.length||p.sel<0)p.sel=0;const m=M[p.sel],L=m?lampOf(m):{};['asesmen','lkpd','rubrik'].forEach(k=>p.out[k]=L[k]||'');const done=M.filter(x=>{const q=lampOf(x);return q.lkpd&&q.asesmen}).length;
return`<div class="card"><h2>LKPD · Asesmen · Rubrik per RPP</h2><p>Setiap RPP memiliki LKPD, asesmen, dan rubrik sendiri. Gambar dibuat AI sebagai ilustrasi vektor (SVG) dan ikut diekspor ke Word dan PDF.</p>${M.length?`<label>Pilih RPP<select onchange="selM(this.value)">${M.map((x,k)=>`<option value="${k}"${k==p.sel?' selected':''}>${lbU(x)} | TP ${x.i+1} | ${x.jp} JP | ${lampOf(x).lkpd&&lampOf(x).asesmen?'lengkap':'belum lengkap'}</option>`).join('')}</select></label>`:'<div class="wr">Belum ada RPP. Buat TP dan RPP lebih dulu.</div>'}${m&&!getR(m)?'<div class="wr">RPP untuk pertemuan ini belum dibuat; LKPD dan asesmen lebih selaras jika RPP dibuat lebih dulu.</div>':''}<p>${done} dari ${M.length} RPP sudah memiliki LKPD dan asesmen.</p><button class="b" ${LB.run||!M.length?'disabled':''} onclick="lbatch()">${LB.run?`⏳ Menyusun ${Math.min(LB.done+1,LB.tot)} dari ${LB.tot}…`:'⚡ Generate LKPD & asesmen untuk semua RPP'}</button>${LB.run?'<button class="b d" onclick="LB.stop=1">Hentikan</button>':''}<button class="b s" onclick="pkgExp('w')">📦 Paket RPP ini (Word)</button><button class="b s" onclick="pkgExp('p')">📦 Paket RPP ini (PDF)</button>${LB.err?`<div class="wr">${esc(LB.err)}</div>`:''}<p><small>Paket berisi RPP + LKPD + asesmen + rubrik untuk RPP yang dipilih. Unduhan gabungan di tab RPP memuat semua RPP beserta lampirannya.</small></p></div>${out('asesmen','Asesmen')}${out('lkpd','LKPD')}${out('rubrik','Rubrik')}`}
function dd(id,m){const a=S.docs.find(x=>x.id==id);m=='w'?exp(a.kunci,a.isi,a.judul):pdf(a.kunci,a.isi,a.judul)}
render();
